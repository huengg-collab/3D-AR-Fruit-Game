<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D AR 體感接水果遊戲</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif;overflow:hidden}
#game{position:fixed;inset:0}canvas{display:block}
.panel{position:fixed;z-index:3;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:#101827d9;border:1px solid #ffffff30;border-radius:14px;padding:9px 13px;font-weight:700}
#message{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,430px);padding:22px;border-radius:20px;background:#152238f2;text-align:center;border:1px solid #ffffff35}
#message h1{font-size:24px;margin:0 0 8px}#message p{line-height:1.55;color:#d7e2f2}
button{border:0;border-radius:12px;padding:12px 18px;background:#ffca4b;color:#252525;font-size:16px;font-weight:800;margin:5px}
#camera{position:fixed;right:12px;bottom:12px;width:116px;height:88px;object-fit:cover;border-radius:12px;transform:scaleX(-1);z-index:2;border:2px solid #ffffff66;display:none}
#hint{position:fixed;bottom:14px;left:12px;z-index:2;background:#101827c9;padding:8px 11px;border-radius:10px;font-size:12px;color:#d7e2f2}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game"></div>
<div class="panel"><div class="pill">🍎 分數：<span id="score">0</span></div><div class="pill">⏱️ 時間：<span id="time">30</span> 秒</div><div class="pill">❤️ 生命：<span id="life">3</span></div></div>
<video id="camera" playsinline muted></video>
<div id="hint">操作：移動頭部控制籃子；張嘴接水果。也可用手指／滑鼠拖曳。</div>
<div id="message">
<h1>🍓 3D AR 體感接水果</h1>
<p>30 秒內接住水果得分，避開會冒火花的炸彈！<br>允許使用前鏡頭時：左右移動頭部控制籃子，張嘴可增加接取判定。<br>不使用鏡頭時：用手指或滑鼠左右拖曳籃子。</p>
<button id="cameraBtn">啟用前鏡頭</button><button id="startBtn">開始遊戲</button>
<p id="status" style="font-size:12px;margin-bottom:0">建議使用支援 WebGL 的手機瀏覽器。</p>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const mount=document.querySelector('#game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9bdcf4); scene.fog=new THREE.Fog(0x9bdcf4,14,32);
const camera3d=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera3d.position.set(0,5,13);camera3d.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x54708a,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-4,9,7);sun.castShadow=true;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x5dbb83,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.1;floor.receiveShadow=true;scene.add(floor);
const back=new THREE.Mesh(new THREE.CircleGeometry(8,64),new THREE.MeshBasicMaterial({color:0xc7f0ff}));back.position.set(0,4,-8);scene.add(back);
for(let i=0;i<16;i++){let x=(Math.random()-.5)*20,z=-3-Math.random()*10;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,1.1,7),new THREE.MeshStandardMaterial({color:0x80512d}));trunk.position.set(x,-.2,z);scene.add(trunk);let crown=new THREE.Mesh(new THREE.SphereGeometry(.75,10,8),new THREE.MeshStandardMaterial({color: i%2?0x2b9b63:0x48ae72}));crown.position.set(x,.65,z);crown.scale.y=1.2;scene.add(crown)}
// Basket
const basket=new THREE.Group();scene.add(basket);basket.position.set(0,-.35,4);
const bowl=new THREE.Mesh(new THREE.CylinderGeometry(.95,.72,.48,32,1,true),new THREE.MeshStandardMaterial({color:0xf0a33b,metalness:.12,roughness:.45,side:THREE.DoubleSide}));bowl.rotation.x=Math.PI;bowl.position.y=.05;bowl.castShadow=true; basket.add(bowl);
const base=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.12,32),new THREE.MeshStandardMaterial({color:0xc87926}));base.position.y=-.16;basket.add(base);
const rim=new THREE.Mesh(new THREE.TorusGeometry(.94,.07,8,32),new THREE.MeshStandardMaterial({color:0xffd078}));rim.rotation.x=Math.PI/2;rim.position.y=.28;basket.add(rim);
const fruits=[];let score=0,life=3,time=30,running=false,last=0,spawn=0,faceX=.5,mouthOpen=false,faceActive=false;
const scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),lifeEl=document.querySelector('#life'),msg=document.querySelector('#message'),video=document.querySelector('#camera');
function makeItem(bomb=false){
 let g=new THREE.Group();let color=bomb?0x252b38:[0xef3340,0xffb52e,0x9a55dc,0x35b86b][Math.floor(Math.random()*4)];
 let body=new THREE.Mesh(new THREE.SphereGeometry(bomb?.38:.34,18,14),new THREE.MeshStandardMaterial({color,roughness:.38,metalness:bomb?.4:0}));body.castShadow=true;g.add(body);
 if(!bomb){let leaf=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6),new THREE.MeshStandardMaterial({color:0x2d9b4e}));leaf.scale.set(.55,.25,1);leaf.position.set(.05,.34,0);leaf.rotation.z=-.5;g.add(leaf)}
 else {let ring=new THREE.Mesh(new THREE.TorusGeometry(.47,.035,6,20),new THREE.MeshBasicMaterial({color:0xff6a22}));g.add(ring);let sparks=new THREE.Points(new THREE.BufferGeometry().setFromPoints(Array.from({length:14},()=>new THREE.Vector3((Math.random()-.5)*.9,(Math.random()-.5)*.9,(Math.random()-.5)*.9))),new THREE.PointsMaterial({color:0xffd24a,size:.09}));g.add(sparks)}
 g.position.set((Math.random()-.5)*8,7,-.5);scene.add(g);fruits.push({g,bomb,vy:0});}
function updateItems(dt){for(let i=fruits.length-1;i>=0;i--){let o=fruits[i];o.g.position.y-=dt*4.2;o.g.rotation.y+=dt*2.4;
 if(o.g.position.y<.35 && o.g.position.y>-.15 && Math.abs(o.g.position.x-basket.position.x)<1.15){
  if(o.bomb){life--;lifeEl.textContent=life}else{score+=10;scoreEl.textContent=score}
  scene.remove(o.g);fruits.splice(i,1);continue}
 if(o.g.position.y<-.8){scene.remove(o.g);fruits.splice(i,1)}
}}
function finish(){running=false;msg.classList.remove('hidden');msg.innerHTML=`<h1>遊戲結束！</h1><p>你的分數：<b>${score}</b><br>${life>0?'太棒了，繼續練習！':'小心炸彈，下次再挑戰！'}</p><button id="again">再玩一次</button>`;document.querySelector('#again').onclick=reset}
function reset(){score=0;life=3;time=30;scoreEl.textContent=0;lifeEl.textContent=3;timeEl.textContent=30;fruits.splice(0).forEach(o=>scene.remove(o.g));basket.position.x=0;msg.classList.add('hidden');running=true;last=performance.now();spawn=0}
document.querySelector('#startBtn').onclick=reset;
let dragging=false;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;movePointer(e)});renderer.domElement.addEventListener('pointermove',e=>{if(dragging)movePointer(e)});addEventListener('pointerup',()=>dragging=false);
function movePointer(e){let r=renderer.domElement.getBoundingClientRect();basket.position.x=((e.clientX-r.left)/r.width-.5)*9}
async function enableCamera(){
 try{
  video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});await video.play();video.style.display='block';
  const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');
  const fileset=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const landmarker=await vision.FaceLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});
  faceActive=true;document.querySelector('#status').textContent='前鏡頭已啟用！左右移動頭部、張嘴接水果。';
  let stamp=-1;function track(){if(video.readyState>=2&&video.currentTime!==stamp){stamp=video.currentTime;let res=landmarker.detectForVideo(video,performance.now());if(res.faceLandmarks?.length){let p=res.faceLandmarks[0][1];faceX=p.x;basket.position.x=(.5-faceX)*9;let cats=res.faceBlendshapes?.[0]?.categories||[];let jaw=cats.find(c=>c.categoryName==='jawOpen');mouthOpen=!!jaw&&jaw.score>.35}}requestAnimationFrame(track)}track();
 }catch(e){document.querySelector('#status').textContent='無法啟用鏡頭，請使用手指／滑鼠拖曳。';}
}
document.querySelector('#cameraBtn').onclick=enableCamera;
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000||0,.05);if(running){last=now;time-=dt;spawn-=dt;if(spawn<=0){makeItem(Math.random()<.23);spawn=.72+Math.random()*.45}updateItems(dt);timeEl.textContent=Math.max(0,Math.ceil(time));if(time<=0||life<=0)finish();if(faceActive&&mouthOpen){basket.scale.setScalar(1.08)}else basket.scale.setScalar(1)}renderer.render(scene,camera3d)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera3d.aspect=innerWidth/innerHeight;camera3d.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
